name: CI

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Añadir feature al README
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH" >> README.md

      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Actualizar README con feature [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-dev:
    needs: update-readme
    runs-on: self-hosted

    steps:
      - name: Validar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "DEV_TOKEN válido"
          } else {
            Write-Host "DEV_TOKEN no coincide"
            exit 1
          }
