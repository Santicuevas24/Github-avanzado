name: Prueba de tokens

on:
  push:

jobs:
  comprobar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comprobar variables
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Host "DEV_TOKEN está vacío"
          } else {
            Write-Host "DEV_TOKEN está presente"
          }

          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Host "LOCAL_DEV_TOKEN está vacío"
          } else {
            Write-Host "LOCAL_DEV_TOKEN está presente"
          }

          if ($env:DEV_TOKEN.Length -eq $env:LOCAL_DEV_TOKEN.Length) {
            Write-Host "Ambos tokens tienen la misma longitud"
          } else {
            Write-Host "Los tokens tienen distinta longitud"
          }